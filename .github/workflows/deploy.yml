name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build static site
        run: pnpm run build:demo
        env:
          VITE_BASE_URL: "/${{ github.event.repository.name }}/"
          VITE_PUBLIC_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Start static server for prerender
        run: python3 -m http.server 4173 --directory dist-demo &

      - name: Prerender with Playwright
        run: node scripts/prerender-playwright.mjs
        env:
          VITE_PUBLIC_URL: "http://localhost:4173"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: dist-demo
